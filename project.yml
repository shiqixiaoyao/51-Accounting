name: 51-Accounting
options:
  bundleIdPrefix: com.shiqixiaoyao
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  51-Accounting:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - .github
          - README.md
          - project.yml
          - "*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiqixiaoyao.fiftyone
        INFOPLIST_KEY_CFBundleDisplayName: 51 记账
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
