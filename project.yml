name: Accounting51
options:
  bundleIdPrefix: com.shiqixiaoyao
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
targets:
  Accounting51:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: 51App.swift
      - path: AI
      - path: Export
      - path: Models
      - path: Services
      - path: Security
      - path: Sync
      - path: Views
    info:
      path: Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.shiqixiaoyao.accounting51
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0"
      SWIFT_VERSION: "5.9"
      ENABLE_TESTABILITY: YES
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
  Accounting51Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: Accounting51
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.shiqixiaoyao.accounting51.tests
schemes:
  Accounting51:
    build:
      targets:
        Accounting51: all
        Accounting51Tests: [test]
    test:
      config: Debug
      targets:
        - name: Accounting51Tests
          parallelizable: false
          randomExecutionOrder: false
