name: 构建 51 iOS IPA

"on":
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

env:
  PROJECT_NAME: 51-Accounting
  BUILD_DIR: build

jobs:
  build:
    name: 构建并打包 IPA
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        shell: bash
        run: |
          set -euo pipefail
          if find . -maxdepth 2 -name '*.xcodeproj' -print -quit | grep -q .; then
            echo '发现现有 Xcode 工程，跳过自动生成。'
          else
            cat > project.yml <<'YAML'
name: 51-Accounting
options:
  bundleIdPrefix: com.shiqixiaoyao
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  51-Accounting:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - .github
          - README.md
          - project.yml
          - "*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiqixiaoyao.fiftyone
        INFOPLIST_KEY_CFBundleDisplayName: 51 记账
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
YAML
            xcodegen generate --spec project.yml --project 51-Accounting.xcodeproj
          fi
          test -f 51-Accounting.xcodeproj/project.pbxproj
          xcodebuild -list -project 51-Accounting.xcodeproj

      - name: 构建未签名应用
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project 51-Accounting.xcodeproj \
            -scheme 51-Accounting \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: 打包未签名 IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path=$(find "$BUILD_DIR/Build/Products" -type d -name '*.app' -path '*iphoneos*' -print -quit)
          if [ -z "$app_path" ]; then
            echo '未找到构建产物 .app。' >&2
            find "$BUILD_DIR" -maxdepth 5 -print >&2 || true
            exit 1
          fi
          rm -rf Payload 51-Accounting.ipa
          mkdir -p Payload
          cp -R "$app_path" Payload/
          /usr/bin/zip -qry 51-Accounting.ipa Payload
          test -s 51-Accounting.ipa

      - name: 上传 IPA 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 51-Accounting-ipa
          path: 51-Accounting.ipa
          if-no-files-found: error

      - name: 将 IPA 附加到发布版本
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          files: 51-Accounting.ipa
