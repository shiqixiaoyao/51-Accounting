name: Build 51 Accounting IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and package IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Verify source tree
        run: |
          set -euxo pipefail
          test -f 51App.swift
          for directory in AI Export Models Services Security Sync Views Tests; do test -d "$directory"; done
          test -f Info.plist
      - name: Install tools
        run: brew install xcodegen swiftlint
      - name: SwiftLint
        run: swiftlint lint --config .swiftlint.yml --lenient
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Validate project and schemes
        run: xcodebuild -list -project Accounting51.xcodeproj
      - name: Compile test bundle without booting a simulator
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Accounting51.xcodeproj -scheme Accounting51 -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=NO GCC_TREAT_WARNINGS_AS_ERRORS=NO 2>&1 | tee test-build.log
      - name: Run unit tests on a fixed simulator
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test -project Accounting51.xcodeproj -scheme Accounting51 -destination 'platform=iOS Simulator,OS=17.5,name=iPhone 15' -parallel-testing-enabled NO -maximum-parallel-testing-workers 1 CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=NO GCC_TREAT_WARNINGS_AS_ERRORS=NO 2>&1 | tee test.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 51-Accounting-test-diagnostics
          path: |
            test-build.log
            test.log
          if-no-files-found: ignore
      - name: Build app for device
        run: |
          set -o pipefail
          set -x
          rm -rf build build.log
          xcodebuild clean build \
            -project Accounting51.xcodeproj \
            -scheme Accounting51 \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            2>&1 | tee build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 51-Accounting-build-diagnostics
          path: build.log
          if-no-files-found: ignore
      - name: Package IPA
        run: |
          set -euxo pipefail
          test -d build/Build/Products/Release-iphoneos/Accounting51.app
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/Accounting51.app build/Payload/
          cd build
          zip -qry 51-Accounting.ipa Payload
          test -s 51-Accounting.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 51-Accounting-IPA
          path: build/51-Accounting.ipa
          if-no-files-found: error