name: Build 51 Accounting IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and package IPA
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          rm -rf *.xcodeproj
          xcodegen generate --spec project.yml --verbose

      - name: Build app with xcodebuild
        run: |
          xcodebuild clean build \
            -project Accounting51.xcodeproj \
            -scheme Accounting51 \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/Accounting51.app build/Payload/
          cd build && zip -qry 51-Accounting.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 51-Accounting-IPA
          path: build/51-Accounting.ipa
          if-no-files-found: error
