name: Build 51 Accounting IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
  GCC_TREAT_WARNINGS_AS_ERRORS: NO
  ONLY_ACTIVE_ARCH: NO

jobs:
  build:
    name: Build and package IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Verify source tree
        run: |
          set -euxo pipefail
          test -f 51App.swift
          for directory in AI Export Models Services Security Sync Views Tests; do
            test -d "$directory"
          done
          test -f Info.plist

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: SwiftLint
        run: swiftlint lint --config .swiftlint.yml --lenient

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Validate project and schemes
        run: xcodebuild -list -project Accounting51.xcodeproj

      - name: Compile test bundle without booting a simulator
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Accounting51.xcodeproj \
            -scheme Accounting51 \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test-build.log

      - name: Run unit tests on a fixed simulator
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project Accounting51.xcodeproj \
            -scheme Accounting51 \
            -destination 'platform=iOS Simulator,OS=17.5,name=iPhone 15' \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 51-Accounting-test-diagnostics
          path: |
            test-build.log
            test.log
          if-no-files-found: ignore

      - name: Build app for device
        shell: bash
        run: |
          set -uo pipefail
          rm -rf build build.log
          echo '=== Device build command ==='
          xcodebuild clean build \
            -project Accounting51.xcodeproj \
            -scheme Accounting51 \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            2>&1 | tee build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            echo '=== FULL xcodebuild OUTPUT (build.log) ==='
            cat build.log
            {
              echo '## Device build failure'
              echo
              echo 'The complete xcodebuild output follows:'
              echo '```text'
              cat build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$build_status"
          fi
          echo '=== DEVICE BUILD SUCCEEDED ==='

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 51-Accounting-build-diagnostics
          path: build.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          set -euxo pipefail
          test -d build/Build/Products/Release-iphoneos/Accounting51.app
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/Accounting51.app build/Payload/
          cd build
          zip -qry 51-Accounting.ipa Payload
          test -s 51-Accounting.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 51-Accounting-IPA
          path: build/51-Accounting.ipa
          if-no-files-found: error

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build.${{ github.run_number }}
          name: 51 Accounting Build ${{ github.run_number }} — Pre-release
          body: |
            51 Accounting Build ${{ github.run_number }} — Pre-release

            This pre-release was built from commit ${{ github.sha }}.

            The workflow completed SwiftLint, XcodeGen project generation, scheme validation, iOS device Release compilation, IPA packaging, and artifact upload.

            Highlights:
            - Phase 1 bookkeeping refactor and improved account, category, transaction, and double-entry consistency.
            - Dynamic account creation from the add-transaction flow with automatic source/destination selection.
            - Account.ID-based selection and canonical Beancount ledger paths: Assets, Liabilities, Equity, Income, and Expenses.
            - Dynamic income and expense category filtering, transfer validation, two-decimal monetary precision, and balanced postings.
            - Fei Er / Poke AI bookkeeping entry point with AIBookkeepingManager integration.
            - Configurable Poke (Fei Er), OpenAI-compatible, DeepSeek, Claude, and custom AI endpoints, including model and API key settings.

            Installation:
            This IPA is unsigned and is intended for build archival and technical verification. Apple signing and an appropriate distribution channel are required for installation on a regular iPhone.
          files: build/51-Accounting.ipa
          prerelease: true
          draft: false
          generate_release_notes: false
          fail_on_unmatched_files: true
