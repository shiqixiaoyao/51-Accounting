name: Build 51 Accounting IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and package IPA
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Inspect source tree
        run: |
          set -euxo pipefail
          pwd
          find . -maxdepth 2 -type f | sort
          test -f 51App.swift
          test -d AI
          test -d Export
          test -d Models
          test -d Sync
          test -d Views

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          set -uo pipefail
          rm -rf Accounting51.xcodeproj
          if ! xcodegen generate --spec project.yml --verbose; then
            echo '--- project.yml ---'
            cat project.yml
            echo '--- source tree ---'
            find . -maxdepth 2 -print | sort
            exit 1
          fi
          test -f Accounting51.xcodeproj/project.pbxproj

      - name: Validate Xcode project
        run: xcodebuild -list -project Accounting51.xcodeproj

      - name: Build app with xcodebuild
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild clean build \
            -project Accounting51.xcodeproj \
            -scheme Accounting51 \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail
          test -d build/Build/Products/Release-iphoneos/Accounting51.app
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/Accounting51.app build/Payload/
          cd build
          zip -qry 51-Accounting.ipa Payload
          test -s 51-Accounting.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 51-Accounting-IPA
          path: build/51-Accounting.ipa
          if-no-files-found: error
