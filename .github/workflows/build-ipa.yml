name: 构建 51 iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 安装 XcodeGen
        if: ${{ !hashFiles('*.xcodeproj/project.pbxproj') }}
        run: brew install xcodegen

      - name: 生成 Xcode 工程（如果仓库没有工程文件）
        shell: bash
        run: |
          set -euo pipefail
          if find . -maxdepth 2 -name '*.xcodeproj' -print -quit | grep -q .; then
            echo '发现现有 Xcode 工程，跳过生成。'
            exit 0
          fi
          cat > project.yml <<'YAML'
name: 51-Accounting
options:
  bundleIdPrefix: com.shiqixiaoyao
  deploymentTarget:
    iOS: "17.0"
targets:
  51-Accounting:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - .github
          - README.md
          - project.yml
          - "*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiqixiaoyao.fiftyone
        INFOPLIST_KEY_CFBundleDisplayName: 51 记账
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
YAML
          xcodegen generate --spec project.yml --project 51-Accounting.xcodeproj

      - name: 构建未签名应用
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project 51-Accounting.xcodeproj \
            -scheme 51-Accounting \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: 打包未签名 IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -type d -name '*.app' -path '*iphoneos*' -print -quit)
          if [ -z "$APP" ]; then
            echo '未找到构建产物 .app。' >&2
            exit 1
          fi
          rm -rf Payload 51-Accounting.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry 51-Accounting.ipa Payload

      - name: 上传 IPA 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 51-Accounting-ipa
          path: 51-Accounting.ipa
          if-no-files-found: error

      - name: 将 IPA 附加到发布版本
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          files: 51-Accounting.ipa
