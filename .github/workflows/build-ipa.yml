name: Build 51 Accounting IPA

"on":
  push:
    branches:
      - main
  workflow_dispatch: {}
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build and package IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml --project 51-Accounting.xcodeproj

      - name: Validate Xcode project
        run: xcodebuild -list -project 51-Accounting.xcodeproj

      - name: Build unsigned app
        run: >-
          xcodebuild
          -project 51-Accounting.xcodeproj
          -scheme 51-Accounting
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path=$(find build/Build/Products -type d -name '*.app' -path '*iphoneos*' -print -quit)
          test -n "$app_path"
          rm -rf Payload 51-Accounting.ipa
          mkdir -p Payload
          cp -R "$app_path" Payload/
          zip -qry 51-Accounting.ipa Payload
          test -s 51-Accounting.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 51-Accounting-ipa
          path: 51-Accounting.ipa
          if-no-files-found: error

      - name: Attach IPA to release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          files: 51-Accounting.ipa
