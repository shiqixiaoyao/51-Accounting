name: Build 51 Accounting IPA
on: { push: { branches: [main] }, workflow_dispatch: }
permissions: { contents: write }
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Verify source tree
        run: |
          set -euxo pipefail
          test -f 51App.swift; test -d AI; test -d Export; test -d Models; test -d Services; test -d Security; test -d Sync; test -d Views; test -f Info.plist
      - name: Install tools
        run: brew install xcodegen swiftlint
      - name: SwiftLint
        run: swiftlint lint --config .swiftlint.yml --strict
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Validate project
        run: xcodebuild -list -project Accounting51.xcodeproj
      - name: Test
        run: xcodebuild test -project Accounting51.xcodeproj -scheme Accounting51 -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' CODE_SIGNING_ALLOWED=NO
      - name: Build
        run: xcodebuild clean build -project Accounting51.xcodeproj -scheme Accounting51 -destination 'generic/platform=iOS' -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          set -euxo pipefail
          mkdir -p build/Payload; cp -R build/Build/Products/Release-iphoneos/Accounting51.app build/Payload/; cd build; zip -qry 51-Accounting.ipa Payload
      - uses: softprops/action-gh-release@v2
        with: { tag_name: v0.1.0-build.${{ github.run_number }}, name: 51 Accounting Build ${{ github.run_number }}, files: build/51-Accounting.ipa }
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
      - uses: actions/upload-artifact@v4
        with: { name: 51-Accounting-IPA, path: build/51-Accounting.ipa }
