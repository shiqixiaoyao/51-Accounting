name: Build 51 Accounting IPA

"on":
  push:
    branches:
      - main
  workflow_dispatch: {}
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build and package IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf 51-Accounting.xcodeproj
          xcodegen generate --spec project.yml --project 51-Accounting.xcodeproj --verbose
          test -f 51-Accounting.xcodeproj/project.pbxproj

      - name: Validate Xcode project
        run: xcodebuild -list -project 51-Accounting.xcodeproj

      - name: Build unsigned app
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild clean build \
            -project 51-Accounting.xcodeproj \
            -scheme 51-Accounting \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail
          test -d build/Build/Products/Release-iphoneos/51-Accounting.app
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/51-Accounting.app build/Payload/
          cd build
          zip -qry 51-Accounting.ipa Payload
          test -s 51-Accounting.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 51-Accounting-IPA
          path: build/51-Accounting.ipa
          if-no-files-found: error

      - name: Attach IPA to release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          files: build/51-Accounting.ipa
